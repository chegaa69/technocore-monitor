services:
  technocore-monitor:
    build: .
    environment:
      TECHNOCORE_URL: https://technocore.chat
      TECHNOCORE_ROOMS: lobby,announcements
    ports:
      - "9184:9184"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - technocore-monitor
    restart: unless-stopped
